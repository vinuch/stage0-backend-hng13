[package]
name = "stage0-profile"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.6"
chrono = "0.4.42"
dashmap = "6.1.0"
governor = "0.10.1"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
